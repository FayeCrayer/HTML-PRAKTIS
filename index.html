<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="icon" type="image/jpg" href="aizen.jpg">
        <title>AAAAAA</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                background: black;
                overflow: hidden;
            }
            img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
        </style>
    </head>
    <body>
        <img src="aizen.jpg" alt="">
        <audio autoplay loop id="troll-audio">
            <source src="hehe.mp3">
        </audio>
        <script>
            function playAudio() {
                var audio = document.getElementById('troll-audio');
                audio.play().catch(function() {});
            }
            document.addEventListener('click', playAudio, { once: true });
            document.addEventListener('touchstart', playAudio, { once: true });
        </script>
    </body>
</html>
